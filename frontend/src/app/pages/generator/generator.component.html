<div class="search-box">
    <input type="text" [(ngModel)]="searchQuery"
        placeholder="What recipe do you need? (for example: a chicken dinner under 400 kcal)" [disabled]="isLoading()">

    <button (click)="generateRecipe()" [disabled]="isLoading() || !searchQuery()">
        {{ isLoading() ? 'Generating...' : 'Create recipe' }}
    </button>
</div>


@if (isLoading()) {
<div class="loading">
    <p>Generating...</p>
</div>
}

@let current = currentRecipe();

@if (!isLoading() && current) {
<app-card [recipe]="current">
    @if (revisionsLeft() > 0 && !isSaved()) {
    <div class="refine-box">
        <p>Edits remaining: <strong>{{ revisionsLeft() }}</strong></p>

        <input type="text" [(ngModel)]="refinementQuery"
            placeholder="What would you change? (For example: replace chicken with turkey)">

        <button (click)="refineRecipe()" [disabled]="!refinementQuery()">Update recipe</button>
    </div>
    }

    <div class="actions">
        <button class="save-btn" (click)="saveRecipe()" [disabled]="isSaved()">
            {{ isSaved() ? 'Saved' : 'Save' }}
        </button>
    </div>
</app-card>
}
