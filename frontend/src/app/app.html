<div class="container">
    <div class="header-row">
        <h1>AI Recipe Assistant</h1>
        <button class="theme-toggle" (click)="toggleTheme()" aria-label="Toggle theme">
            {{ isDark() ? '☀️' : '🌙' }}
        </button>
    </div>

    <div class="nav-tabs">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-btn">
            Create recipe
        </a>
        <a routerLink="/favorites" routerLinkActive="active" class="nav-btn">My favories</a>
        <a routerLink="/catalog" routerLinkActive="active" class="nav-btn">Catalog</a>
    </div>

    <router-outlet></router-outlet>
</div>

<app-toast></app-toast>
